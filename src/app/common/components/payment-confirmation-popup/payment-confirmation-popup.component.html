<div class="overlay">
    <div class="custom_popup__container bm-card">
        <div class="popup-header">
            <p class="title">{{ data.title }}</p>
            <p class="sub-title">Record payment details for this invoice.</p>
        </div>

        <div class="content_box">
            <div class="bm-label-input">
                <label for="paymentType">Payment Type</label>
                <app-bm-select [options]="paymentSelectOptions" (valueChange)="onPaymentTypeChange($event)">
                </app-bm-select>
            </div>

            <div class="bm-label-input">
                <label for="paymentRefNumber">Reference Number</label>
                <input id="paymentRefNumber" type="text" class="bm-input" [disabled]="paymentType==='CASH'"
                    [(ngModel)]="paymentRefNumber" placeholder="Enter reference number" />
            </div>

            <div class="bm-label-input">
                <label for="amount">Amount</label>
                <input id="amount" type="number" class="bm-input" [disabled]="!isPartial" [(ngModel)]="amount" />
            </div>

            <div class="payment-mode-row">
                <div>
                    <p class="mode-title">{{isPartial ? 'Partial Payment' : 'Full Payment'}}</p>
                    <p class="mode-description">Enable partial payment to edit the amount.</p>
                </div>
                <label for="partialPayment" class="toggle">
                    <input id="partialPayment" type="checkbox" [(ngModel)]="isPartial">
                    <span class="slider"></span>
                </label>
            </div>

            <div class="btn-container">
                @if (data.showCancelBtn) {
                <button type="button" class="bm-btn bm-btn-secondary" (click)="onButtonClick(false)">
                    Cancel
                </button>
                }
                @if (data.showConfirmBtn) {
                <button type="button" class="bm-btn bm-btn-primary" (click)="onButtonClick(true)">
                    Submit
                </button>
                }
            </div>
        </div>
    </div>
</div>
