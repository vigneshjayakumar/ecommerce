<div class="main-container">
    <form class="form-container" [formGroup]="createBranchForm" (ngSubmit)="onSubmit()">
        <div class="field">
            <label for="name">Branch Name</label>
            <input type="text" id="name" formControlName="name" />
        </div>
        <div class="field">
            <label for="code">Branch code</label>
            <input type="text" id="code" formControlName="branchCode" />
        </div>
        <div class="field">
            <label for="name">Branch type</label>
            <select id="name" formControlName="branchType">
                @for(type of branchTypeList;track $index){
                <option [value]="type">{{type}}</option>
                }
            </select>
        </div>
        <div class="field">
            <label for="address">Address</label>
            <input type="text" id="address" formControlName="address" />
        </div>
        <div class="field">
            <label for="city">City</label>
            <input type="text" id="city" formControlName="city" />
        </div>
        <div class="field">
            <label for="state">State</label>
            <input type="text" id="state" formControlName="state" />
        </div>
        <div class="field">
            <label for="pincode">Pincode</label>
            <input type="number" id="pincode" formControlName="pincode" />
        </div>
        <div class="field">
            <label for="phoneNumber">Phone number</label>
            <input type="number" id="phoneNumber" formControlName="phoneNumber" />
        </div>
        <div class="field">
            <label for="email">E-mail</label>
            <input type="email" id="email" formControlName="email" />
        </div>
        <div class="field">
            <label for="isActive">Is Active</label>
            <input type="checkbox" id="isActive" formControlName="isActive" />
        </div>
        <div class="field">
            <label for="isDefault">Is Default Branch (Primary branch)</label>
            <input type="checkbox" id="isDefault" formControlName="isDefault" />
        </div>
        <div class="field">
            <label for="gst">GST Number</label>
            <input type="text" id="gst" formControlName="gstNumber" />
        </div>
        <div class="btn-container">
            <button type="button" class="btn btn-outline-secondary" (click)="onClear()">Clear</button>
            <button type="submit" class="btn btn-outline-primary"> Create Branch </button>
        </div>
    </form>
</div>
