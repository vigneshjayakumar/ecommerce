<main class="main-container">
    <div class="page-header">
        <p class="title">Branch</p>
        <div class="action-container">
            <button class="bm-btn bm-btn-secondary" (click)="onRouteTo('/stocks/transfer')">Transfer Products</button>
            <button class="bm-btn bm-btn-secondary" (click)="onRouteTo('/stocks/purchases')">Purchase</button>
            <button class="bm-btn bm-btn-primary" (click)="onRouteTo('/branch/create-branch')">+ New Branch</button>
        </div>
    </div>
    @if(branchListObs|async){
    <app-table [columns]="productsTableColumn" [rows]="productTableRows" [showCheckbox]="false" [showAction]="true"
        [actionBtnConfig]="actionBtnConfig" (actionEmit)="onTableAction($event)"></app-table>
    <app-bm-pagination [currentPage]="selectedPage" [totalPages]="totalPages" [pageCount]="limit"
        (pageChange)="onPageChange($event)" (pageLimitChange)="onPageLimitChange($event)"></app-bm-pagination>
    }
</main>
