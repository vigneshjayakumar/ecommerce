@if(invoiceDetailsObs|async){
<main>
    <div class="btn-container">
        <button (click)="onPostSalesReturn()">Return</button>
    </div>
    <div class="main-container">
        @for(invoiceProducts of invoiceDetails;track invoiceProducts.id;let i = $index){
        <div class="content">
            <label for="productName">{{invoiceProducts.product_name_snapshot}}</label>
            <p>{{invoiceProducts.quantity}}</p>
            <input type="text" [(ngModel)]="payloadItems[i].quantity">
        </div>
        }

    </div>
</main>
}
