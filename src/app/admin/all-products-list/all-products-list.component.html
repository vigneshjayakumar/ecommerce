<main>
  <div class="main-container">
    <div class="page-header">
      <p class="title">Products</p>
      <div class="action-container">
        <div class="input-wrapper">
          <span class="input-icon">
            <img src="/assets/icons/input-search.svg" alt="search" srcset="">
          </span>
          <input class="bm-input" type="text" placeholder="Search by Name / SKU" [formControl]="searchInput">
        </div>
        <div class="bm-btn bm-btn-secondary">+ Bulk Products</div>
        <div class="bm-btn bm-btn-primary" (click)="onRoute('/admin/create-new')">+ New Product</div>
      </div>
    </div>
    @if (searchProductList.length) {
    <app-table [columns]="productsTableColumn" [rows]="productTableRows" [showCheckbox]="false" [showAction]="true"
      (actionEmit)="onTableAction($event)" [actionBtnConfig]="actionBtnConfig"></app-table>
    <app-bm-pagination [currentPage]="1" [totalPages]="totalPages" (pageLimitChange)="onPageLimitChange($event)" (pageChange)="onPageChange($event)"
      [pageCount]="limit"></app-bm-pagination>
    } @else {
    <div class="no-data">
      <p>No Data Found...</p>
      <button class="btn btn-outline-secondary" (click)="onRoute('/admin/create-new')">
        Add Product to Stock?
      </button>
    </div>
    }
  </div>
</main>
